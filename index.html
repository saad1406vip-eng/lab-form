<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Lab-Form | Sabt Alalaya General Hospital</title>
<style>
body { font-family: 'Tahoma', Arial, sans-serif; background: #eef2f5; padding: 20px; margin: 0; }
.container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
h2, h3, h4 { text-align: center; margin: 5px 0; color: #2c3e50; }
.controls { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
.controls label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
.controls input, .controls select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
.btn { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; font-size: 16px; font-weight: bold; width: 100%; transition: 0.3s; }
.btn:hover { background: #0056b3; }
.btn-print { background: #28a745; margin-top: 10px; }
.btn-print:hover { background: #218838; }
.tech-btn-wrapper { grid-column: 1 / -1; }
.tech-btn { background: #ffc107; color: #856404; font-size: 15px; padding: 12px; border: 2px solid #ffc107; }
.tech-btn:hover { background: #e0a800; color: #533f03; }
.tech-btn .badge { background: #28a745; color: white; padding: 2px 10px; border-radius: 12px; font-size: 12px; margin-right: 8px; }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
.modal-overlay.active { display: flex; }
.modal-box { background: white; border-radius: 10px; padding: 25px; max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
.modal-box h3 { margin-top: 0; margin-bottom: 15px; color: #2c3e50; border-bottom: 2px solid #ffc107; padding-bottom: 10px; }
.modal-tech-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.modal-tech-item { display: flex; align-items: center; padding: 8px 12px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; transition: 0.2s; font-size: 14px; }
.modal-tech-item:hover { background: #e9ecef; }
.modal-tech-item input { margin-left: 10px; width: 18px; height: 18px; cursor: pointer; }
.modal-tech-item.selected { background: #d4edda; border-color: #28a745; }
.modal-buttons { display: flex; gap: 10px; justify-content: space-between; margin-top: 15px; }
.modal-buttons button { flex: 1; padding: 10px; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
.modal-btn-select-all { background: #6c757d; color: white; }
.modal-btn-select-all:hover { background: #5a6268; }
.modal-btn-done { background: #28a745; color: white; }
.modal-btn-done:hover { background: #218838; }
.modal-btn-cancel { background: #dc3545; color: white; }
.modal-btn-cancel:hover { background: #c82333; }

/* تنسيق الفورم */
.form-page { margin-bottom: 40px; border: 2px solid #000; padding: 15px; background: white; position: relative; }
.form-header { text-align: center; margin-bottom: 10px; min-height: 40px; }
.form-info { display: flex; flex-wrap: wrap; justify-content: space-between; margin-bottom: 10px; font-weight: bold; font-size: 14px; gap: 10px; }
table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 11px; background: rgba(255, 255, 255, 0.85); }
th, td { border: 1px solid #000; padding: 4px; text-align: center; }
th { background-color: #d1d8e0; }
.empty-row { background-color: #f9f9f9; }
.signatures { display: flex; justify-content: space-between; margin-top: 30px; font-weight: bold; font-size: 13px; }
.signatures div { border-top: 1px solid #000; width: 45%; text-align: center; padding-top: 5px; }

/* إعدادات الطباعة والخلفية */
@media print {
    body { padding: 0; margin: 0; }
    .container { box-shadow: none; padding: 0; max-width: 100%; }
    .controls, .btn, .tech-btn-wrapper, .modal-overlay, .container > h2, .form-header { display: none !important; }
    
    @page { size: A4 portrait; margin: 0; }
    
    body {
        background-image: url('BG2.PNG') !important;
        background-size: cover !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    
    .form-page {
        page-break-after: always;
        border: none !important;
        margin: 0 !important;
        padding: 160px 40px 100px 40px !important;
        background: transparent !important;
        box-sizing: border-box;
        height: 100vh;
    }
    table { font-size: 10px; background: rgba(255, 255, 255, 0.9) !important; }
    .form-info { font-size: 12px; background: rgba(255, 255, 255, 0.9) !important; padding: 5px; border-radius: 5px; }
}
</style>
</head>
<body>

<div class="container">
    <h2>Lab-Form - Sabt Alalaya General Hospital</h2>
    <div class="controls">
        <div><label>نوع الفورم:</label><select id="formType" onchange="updateDeviceLabel()"><option value="temperature">Temperature Log (درجة الحرارة)</option><option value="stock">Stock & Expiration (المخزون والصلاحية)</option><option value="cleaning">Equipment Cleaning (تنظيف الأجهزة)</option><option value="bloodbank">Blood Bank QC (ضبط جودة بنك الدم)</option><option value="abo">ABO/Rh-D Confirmation (تأكيد فصيلة الدم)</option></select></div>
        <div><label>القسم (Section):</label><select id="section" onchange="updateDevices()"><option value="Chemistry">Chemistry (كيمياء)</option><option value="Hematology">Hematology (هيماتولوجي)</option><option value="Serology">Serology (مصليات)</option><option value="Blood Bank">Blood Bank (بنك الدم)</option><option value="Microbiology">Microbiology (أحياء دقيقة)</option><option value="Hormones">Hormones (هرمونات)</option></select></div>
        <div><label id="deviceLabel">رقم الثلاجة:</label><select id="deviceSelect"></select></div>
        <div><label>نوع النطاق (للحرارة):</label><select id="rangeType"><option value="2-8">2°C to 8°C (عادي)</option><option value="-20">-20°C (تجمد)</option><option value="-80">-80°C (عميق)</option></select></div>
        <div><label>من شهر:</label><input type="month" id="startMonth" value="2026-01"></div>
        <div><label>إلى شهر:</label><input type="month" id="endMonth" value="2026-09"></div>
        <div><label>تاريخ التفتيش (Cut-off):</label><input type="date" id="cutOffDate" value="2026-09-17"></div>
        <div class="tech-btn-wrapper"><button class="btn tech-btn" onclick="openTechModal()">👥 اختيار الفنيين <span class="badge" id="techCount">15</span></button></div>
        <div style="display: flex; align-items: flex-end;"><button class="btn" onclick="generateForms()">🔄 توليد الفورمات</button></div>
    </div>
    <div id="formsContainer"></div>
    <button class="btn btn-print" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
</div>

<div class="modal-overlay" id="techModal">
    <div class="modal-box">
        <h3>👥 اختر الفنيين الذين عملوا خلال هذه الفترة</h3>
        <div class="modal-tech-list" id="techModalList"></div>
        <div class="modal-buttons">
            <button class="modal-btn-select-all" onclick="selectAllTechs()">✓ الكل</button>
            <button class="modal-btn-cancel" onclick="closeTechModal()">✕ إلغاء</button>
            <button class="modal-btn-done" onclick="confirmTechSelection()">✓ تم</button>
        </div>
    </div>
</div>

<script>
const allTechs = ['M. DHAKIL','HOSSAM S.','MANSOUR M.','M. SALAN','MISFER A.','M. NASSER','FAHAD ABD','M. SAAD','M. SALEH','SAAD EID','SULTAN M.','NAIF ABD','A/AZIZ R.','M. KHALAF','NAIF MOHD'];
const refrigerators = Array.from({length: 15}, (_, i) => `Ref-${i + 1}`);
const equipmentDB = {
    'Chemistry': ['Cobas Pure','Siemens Atellica','Siemens Xpand','Cobas c311','Cobas e411','Minividas','Beckman Coulter iChem Velocity'],
    'Hematology': ['Sysmex XT','Beckman Coulter','Alcor iSed','Stago STA Compact Max'],
    'Serology': ['Cobas Pure','Siemens Atellica','Minividas','ELISA Reader','ELISA Washer'],
    'Blood Bank': ['Blood Bank Refrigerator','Plasma Freezer -20','Deep Freezer -80','Blood Mixer','Centrifuge','Cross-match Water Bath','Incubator','Blood Sealer'],
    'Microbiology': ['Autoclave','Incubator','Biosafety Cabinet','Microscope','Centrifuge','Water Bath'],
    'Hormones': ['Cobas Pure','Siemens Atellica','Cobas e411','Minividas','Immunoassay Analyzer']
};
const materialsDB = {
    'Chemistry': ['Glucose','BUN','Creatinine','Cholesterol','Triglycerides','ALT','AST','ALP','Total Bilirubin','Direct Bilirubin','Total Protein','Albumin','Calcium','Phosphorus','Uric Acid','Amylase','CK','CK-MB','LDH','Sodium','Potassium','Chloride','HDL','LDL','Iron','TIBC','Ferritin','CRP','HbA1c','Troponin','Beta HCG'],
    'Hematology': ['Anti-A','Anti-B','Anti-D','D-Dimer Test','Control','Diluent','Lyse','Cleaner','Retic Reagent','Calibrator','QC Normal','QC Abnormal','PT Reagent','APTT Reagent','Fibrinogen','Thrombin Time'],
    'Serology': ['HBsAg','Anti-HBs','Anti-HCV','Anti-HIV','VDRL/RPR','Widal Test','Brucella Test','Toxoplasma IgG','Toxoplasma IgM','Rubella IgG','Rubella IgM','CMV IgG','CMV IgM','Helicobacter Pylori'],
    'Blood Bank': ['Anti-A','Anti-B','Anti-D','Anti-A1','Anti-Human Globulin','LISS','Normal Saline','AHG Reagent','Antibody Screening Cells','Panel Cells','Quality Control Cells'],
    'Microbiology': ['Blood Agar','MacConkey Agar','Chocolate Agar','Mueller-Hinton Agar','XLD Agar','SS Agar','Gram Stain','Ziehl-Neelsen Stain','Coagulase Plasma','Oxidase Reagent','Catalase Reagent'],
    'Hormones': ['TSH','Free T4','Free T3','Total T4','Total T3','Cortisol','Prolactin','FSH','LH','Estradiol (E2)','Progesterone','Testosterone','Beta HCG','Insulin','C-Peptide','Vitamin D','PTH','Calcitonin','Growth Hormone (GH)','ACTH','Aldosterone','Renin','Ferritin','Vitamin B12','Folate','PSA','CA-125']
};

let selectedTechs = [...allTechs];

const rand = (min, max) => (Math.random() * (max - min) + min).toFixed(1);
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const getRandomTech = () => selectedTechs.length === 0 ? allTechs[randInt(0, allTechs.length-1)] : selectedTechs[randInt(0, selectedTechs.length-1)];
const getRandomTime = () => `${randInt(7, 9)}:${String(randInt(0, 59)).padStart(2, '0')}`;
const getRandomExpiry = () => { let d = new Date(); d.setMonth(d.getMonth() + randInt(2, 6)); return `${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`; };
const getRandomUnitNumber = () => `${randInt(10, 99)}${randInt(10000, 99999)}`;

function openTechModal() {
    const list = document.getElementById('techModalList');
    list.innerHTML = '';
    allTechs.forEach((tech, i) => {
        const isSel = selectedTechs.includes(tech);
        const label = document.createElement('label');
        label.className = 'modal-tech-item' + (isSel ? ' selected' : '');
        label.innerHTML = `<input type="checkbox" value="${tech}" ${isSel ? 'checked' : ''}><span>${i + 1}. ${tech}</span>`;
        const cb = label.querySelector('input');
        cb.addEventListener('change', () => label.classList.toggle('selected', cb.checked));
        list.appendChild(label);
    });
    document.getElementById('techModal').classList.add('active');
}
function closeTechModal() { document.getElementById('techModal').classList.remove('active'); }
function selectAllTechs() {
    const cbs = document.querySelectorAll('#techModalList input');
    const allChecked = Array.from(cbs).every(cb => cb.checked);
    cbs.forEach(cb => { cb.checked = !allChecked; cb.closest('.modal-tech-item').classList.toggle('selected', cb.checked); });
}
function confirmTechSelection() {
    const cbs = document.querySelectorAll('#techModalList input:checked');
    selectedTechs = Array.from(cbs).map(cb => cb.value);
    if (selectedTechs.length === 0) selectedTechs = [...allTechs];
    document.getElementById('techCount').textContent = selectedTechs.length;
    closeTechModal();
}
function updateDevices() {
    const sec = document.getElementById('section').value, sel = document.getElementById('deviceSelect');
    sel.innerHTML = '';
    (equipmentDB[sec] || []).forEach(d => { let o = document.createElement('option'); o.value = d; o.textContent = d; sel.appendChild(o); });
}
function updateDeviceLabel() {
    const type = document.getElementById('formType').value, lbl = document.getElementById('deviceLabel'), sel = document.getElementById('deviceSelect');
    sel.innerHTML = '';
    if (type === 'temperature') { lbl.textContent = 'رقم الثلاجة:'; refrigerators.forEach(r => { let o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o); }); }
    else { lbl.textContent = 'الجهاز:'; updateDevices(); }
}

function genTemp(sec, dev, rMin, rMax, y, m, cut) {
    const days = new Date(y, m, 0).getDate(), cutD = new Date(cut); if (new Date(y, m - 1, 1) > cutD) return '';
    let html = `<div class="form-page"><div class="form-info"><span>SECTION: ${sec}</span><span>MONTH: ${m}</span><span>YEAR: ${y}</span><span>REFRIGERATOR NO: ${dev}</span><span>Acceptable range: ${rMin}°C to ${rMax}°C</span></div><table><thead><tr><th rowspan="2">Date</th><th colspan="2">08:00</th><th colspan="2">12:00</th><th colspan="2">16:00</th><th colspan="2">20:00</th><th colspan="2">24:00</th><th colspan="2">04:00</th><th rowspan="2">Cleaning/Alarm check</th></tr><tr><th>Temp</th><th>Tech</th><th>Temp</th><th>Tech</th><th>Temp</th><th>Tech</th><th>Temp</th><th>Tech</th><th>Temp</th><th>Tech</th><th>Temp</th><th>Tech</th></tr></thead><tbody>`;
    for (let d = 1; d <= days; d++) {
        if (new Date(y, m - 1, d) > cutD) html += `<tr class="empty-row"><td>${d}</td>${'<td></td>'.repeat(13)}</tr>`;
        else html += `<tr><td>${d}</td>${Array(6).fill().map(() => `<td>${rand(rMin + 0.1, rMax - 0.1)}</td><td>${getRandomTech()}</td>`).join('')}<td>OK</td></tr>`;
    }
    return html + `</tbody></table><div class="signatures"><div>Supervisor Review</div><div>QC Review</div></div></div>`;
}

function genStock(sec, dev, y, m) {
    const mats = materialsDB[sec] || []; let html = `<div class="form-page"><div class="form-info"><span>DEVICE: ${dev}</span><span>MONTH: ${m}</span><span>SECTION: ${sec}</span></div><table><thead><tr><th>NO.</th><th>ITEMS</th><th>EXP.</th><th>AVAILABILITY</th><th>NO.</th><th>ITEMS</th><th>EXP.</th><th>AVAILABILITY</th></tr></thead><tbody>`;
    const rows = Math.max(25, mats.length);
    for (let i = 0; i < rows; i++) {
        let l = mats[i] || '', r = mats[i + rows] || '';
        html += `<tr><td>${i + 1}</td><td>${l}</td><td>${l ? getRandomExpiry() : ''}</td><td>${l ? randInt(1, 5) : ''}</td><td>${i + 1 + rows}</td><td>${r}</td><td>${r ? getRandomExpiry() : ''}</td><td>${r ? randInt(1, 5) : ''}</td></tr>`;
    }
    return html + `</tbody></table><div class="signatures"><div>Supervisor Review</div><div>Section Head</div></div></div>`;
}

function genClean(sec, dev, y, m, cut) {
    const days = new Date(y, m, 0).getDate(), cutD = new Date(cut); if (new Date(y, m - 1, 1) > cutD) return '';
    let html = `<div class="form-page"><div class="form-info"><span>Department: ${sec}</span><span>Month/Year: ${m}-${y}</span><span>Equipment: ${dev}</span><span>Serial #: ___________</span></div><table><thead><tr><th>Date/ Day</th><th>Time</th><th colspan="2">Cleaned</th><th>Remarks</th><th>Name of Disinfectant Use</th><th>Staff name/ signature</th></tr><tr><th></th><th></th><th>Yes</th><th>No</th><th></th><th></th><th></th></tr></thead><tbody>`;
    for (let d = 1; d <= days; d++) {
        if (new Date(y, m - 1, d) > cutD) html += `<tr class="empty-row"><td>${d} - ${m}-${String(y).slice(-2)}</td>${'<td></td>'.repeat(6)}</tr>`;
        else html += `<tr><td>${d} - ${m}-${String(y).slice(-2)}</td><td>${getRandomTime()}</td><td>✓</td><td></td><td>${Math.random() > 0.85 ? 'Re-cleaned' : ''}</td><td>70% Alcohol</td><td>${getRandomTech()}</td></tr>`;
    }
    return html + `</tbody></table><div class="signatures" style="justify-content: space-around; margin-top: 20px;"><div style="width: 45%;">Laboratory Staff: ___________________</div><div style="width: 45%;">IPC Staff: ___________________</div></div><p style="text-align: center; font-size: 10px; margin-top: 20px; color: #666;">SAAH-IPC-EH-005/FM-017</p></div>`;
}

function genBB(sec, dev, y, m, cut) {
    const days = new Date(y, m, 0).getDate(), cutD = new Date(cut); if (new Date(y, m - 1, 1) > cutD) return '';
    let html = `<div class="form-page"><div class="form-info"><span>MONTH: ${m}</span><span>YEAR: ${y}</span><span>Equipment: ${dev}</span><span>Serial #: ___________</span></div><table><thead><tr><th rowspan="2">Date</th><th colspan="3">Daily:</th><th colspan="3">Problems</th></tr><tr><th>Cleaning &<br>Decontamination</th><th>Sealing Capacity<br>(OK)</th><th>Tech. Sign. &<br>position</th><th>Corrective<br>Action</th><th>Initials</th><th>Reviewed by</th></tr></thead><tbody>`;
    for (let d = 1; d <= days; d++) {
        if (new Date(y, m - 1, d) > cutD) html += `<tr class="empty-row"><td>${d}</td>${'<td></td>'.repeat(6)}</tr>`;
        else html += `<tr><td>${d}</td><td>✓</td><td>✓ (${(Math.random() * 0.20 + 1.10).toFixed(2)})</td><td>${getRandomTech()}</td><td>OK</td><td></td><td></td></tr>`;
    }
    return html + `</tbody></table><div class="signatures" style="justify-content: space-between; margin-top: 20px;"><div style="width: 30%;">Reviewed by: ___________</div><div style="width: 30%;">Supervisor Review: ___________</div><div style="width: 30%;">QC Review: ___________</div></div><p style="text-align: center; font-size: 10px; margin-top: 15px; color: #666;">LB-DP-FM-04</p></div>`;
}

function genABO(sec, dev, y, m, cut) {
    const days = new Date(y, m, 0).getDate(), cutD = new Date(cut); if (new Date(y, m - 1, 1) > cutD) return '';
    const lbls = ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'];
    const getValidD = () => { const l = (new Date(y, m - 1, 1) > cutD) ? 0 : Math.min(days, cutD.getDate()); return l < 1 ? null : randInt(1, l); };
    let html = `<div class="form-page"><div class="form-info" style="margin-bottom: 15px;"><span>MONTH: ${m}</span><span>YEAR: ${y}</span></div><table style="font-size: 9px;"><thead><tr><th style="width: 4%;">NO</th><th style="width: 10%;">Date</th><th style="width: 12%;">Unit Number</th><th style="width: 8%;">Label<br>ABO/Rh</th><th style="width: 10%;">Anti-A Result</th><th style="width: 10%;">Anti-B Result</th><th style="width: 10%;">Anti-D Result</th><th style="width: 10%;">Confirmed<br>ABO/Rh</th><th style="width: 14%;">Match?<br>(Yes/No)</th><th style="width: 12%;">Signature</th></tr></thead><tbody>`;
    for (let i = 1; i <= 15; i++) {
        let dt = '', un = '', lb = '', aA = '', aB = '', aD = '', cf = '', mt = '', sg = '';
        if (Math.random() > 0.15) {
            const d = getValidD();
            if (d) {
                dt = `${d}-${m}-${y}`; un = getRandomUnitNumber(); lb = lbls[randInt(0, 7)]; cf = lb;
                const ab = lb.replace('+', '').replace('-', ''), rh = lb.includes('+') ? '+' : '-';
                aA = (ab === 'A' || ab === 'AB') ? '□ + ■ -' : '■ + □ -'; aB = (ab === 'B' || ab === 'AB') ? '□ + ■ -' : '■ + □ -'; aD = (rh === '+') ? '□ + ■ -' : '■ + □ -';
                mt = '☑ Yes  ☐ No'; sg = getRandomTech();
            }
        }
        html += `<tr><td>${i}.</td><td>${dt}</td><td>${un}</td><td>${lb}</td><td>${aA || '□ + □ -'}</td><td>${aB || '□ + □ -'}</td><td>${aD || '□ + □ -'}</td><td>${cf}</td><td>${mt || '☐ Yes  ☐ No'}</td><td>${sg}</td></tr>`;
    }
    return html + `</tbody></table><div style="margin-top: 20px; font-size: 11px;"><p style="font-weight: bold; margin-bottom: 5px;">SEGMENT FORWARD</p><p style="font-weight: bold; margin: 5px 0;">Reviewed By (Supervisor):</p><div style="display: flex; justify-content: space-between; margin-top: 10px;"><span>Name: ______________________</span><span>Signature: ______________________</span><span>Date: ______________________</span></div></div></div>`;
}

function generateForms() {
    const type = document.getElementById('formType').value, sec = document.getElementById('section').value, dev = document.getElementById('deviceSelect').value, rng = document.getElementById('rangeType').value, start = document.getElementById('startMonth').value, end = document.getElementById('endMonth').value, cut = document.getElementById('cutOffDate').value;
    let rMin = 2, rMax = 8; if (rng === '-20') { rMin = -20.5; rMax = -19.5; } if (rng === '-80') { rMin = -80.5; rMax = -79.5; }
    const [sY, sM] = start.split('-').map(Number), [eY, eM] = end.split('-').map(Number);
    let cont = document.getElementById('formsContainer'); cont.innerHTML = '';
    let cY = sY, cM = sM;
    while (cY < eY || (cY === eY && cM <= eM)) {
        let h = '';
        if (type === 'temperature') h = genTemp(sec, dev, rMin, rMax, cY, cM, cut);
        else if (type === 'stock') h = genStock(sec, dev, cY, cM);
        else if (type === 'cleaning') h = genClean(sec, dev, cY, cM, cut);
        else if (type === 'bloodbank') h = genBB(sec, dev, cY, cM, cut);
        else if (type === 'abo') h = genABO(sec, dev, cY, cM, cut);
        if (h) cont.innerHTML += h;
        cM++; if (cM > 12) { cM = 1; cY++; }
    }
}

window.onload = function() { updateDeviceLabel(); generateForms(); };
</script>
</body>
</html>
