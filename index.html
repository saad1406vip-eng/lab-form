<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مولد فورمات الثلاجات - مختبر سبت العلاية</title>
    <style>
        body { font-family: 'Tahoma', Arial, sans-serif; background: #eef2f5; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; margin: 5px 0; color: #2c3e50; }
        .logo-placeholder { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; margin-bottom: 15px; }
        .logo { font-weight: bold; color: #2c3e50; }
        
        /* لوحة التحكم */
        .controls { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .controls label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .controls input, .controls select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; font-size: 16px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn:hover { background: #0056b3; }
        .btn-print { background: #28a745; margin-top: 10px; }
        .btn-print:hover { background: #218838; }

        /* الجدول */
        .form-header { text-align: center; margin-bottom: 10px; }
        .form-info { display: flex; flex-wrap: wrap; justify-content: space-between; margin-bottom: 10px; font-weight: bold; font-size: 14px; gap: 10px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 11px; }
        th, td { border: 1px solid #000; padding: 4px; text-align: center; }
        th { background-color: #d1d8e0; }
        .empty-row { background-color: #f9f9f9; }

        /* التوقيعات */
        .signatures { display: flex; justify-content: space-between; margin-top: 30px; font-weight: bold; font-size: 13px; }
        .signatures div { border-top: 1px solid #000; width: 45%; text-align: center; padding-top: 5px; }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .controls { display: none; }
            .btn { display: none; }
            table { font-size: 10px; }
            .form-info { font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- لوحة التحكم -->
    <div class="controls">
        <div>
            <label>القسم (Section):</label>
            <select id="section">
                <option value="Chemistry">Chemistry (كيمياء)</option>
                <option value="Hematology">Hematology (هيماتولوجي)</option>
                <option value="Serology">Serology (مصليات)</option>
                <option value="Blood Bank">Blood Bank (بنك الدم)</option>
                <option value="Microbiology">Microbiology (أحياء دقيقة)</option>
            </select>
        </div>
        <div>
            <label>رقم الثلاجة:</label>
            <input type="text" id="fridgeNo" value="Ref-1">
        </div>
        <div>
            <label>نوع النطاق:</label>
            <select id="rangeType" onchange="updateRange()">
                <option value="2-8">2°C to 8°C (عادي)</option>
                <option value="-20">-20°C (تجمد)</option>
                <option value="-80">-80°C (عميق)</option>
            </select>
        </div>
        <div>
            <label>من شهر (بداية):</label>
            <input type="month" id="startMonth" value="2026-01">
        </div>
        <div>
            <label>إلى شهر (نهاية):</label>
            <input type="month" id="endMonth" value="2026-09">
        </div>
        <div>
            <label>تاريخ التفتيش (Cut-off):</label>
            <input type="date" id="cutOffDate" value="2026-09-17">
        </div>
        <div style="display: flex; align-items: flex-end;">
            <button class="btn" onclick="generateForms()">توليد الفورمات</button>
        </div>
    </div>

    <!-- هنا سيتم إدراج الفورمات المولدة -->
    <div id="formsContainer"></div>

    <!-- زر الطباعة -->
    <button class="btn btn-print" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
</div>

<script>
    // دالة توليد رقم عشوائي ضمن نطاق
    function getRandomTemp(min, max) {
        return (Math.random() * (max - min) + min).toFixed(1);
    }

    // أسماء الفنيين (يمكنك تعديلها)
    const techs = ['Ahmed', 'Sara', 'Mohd', 'Ali', 'Fatima', 'Khalid', 'Omar', 'Nora'];

    // دالة توليد فورم واحد لشهر محدد
    function generateMonthForm(section, fridgeNo, rangeMin, rangeMax, year, month, cutOffDateStr) {
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const daysInMonth = new Date(year, month, 0).getDate();
        const cutOffDate = new Date(cutOffDateStr);
        
        // التحقق إذا كان هذا الشهر يسبق تاريخ التفتيش أو يساويه
        const monthStart = new Date(year, month - 1, 1);
        if (monthStart > cutOffDate) return ''; // لا تولد شهوراً مستقبلية

        let html = `
        <div class="form-page" style="page-break-after: always; margin-bottom: 40px; border: 2px solid #000; padding: 15px;">
            <div class="form-header">
                <h3>SABT ALALAYA GENERAL HOSPITAL</h3>
                <h4>LABORATORY AND PATHOLOGY DEPARTMENT</h4>
                <p style="font-weight:bold;">Temperature Log Sheet - ${monthNames[month-1]} ${year}</p>
            </div>
            <div class="form-info">
                <span>SECTION: ${section}</span>
                <span>MONTH: ${month}</span>
                <span>YEAR: ${year}</span>
                <span>REFRIGERATOR NO: ${fridgeNo}</span>
                <span>Acceptable range: ${rangeMin}°C to ${rangeMax}°C</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th rowspan="2">Date</th>
                        <th colspan="2">08:00</th>
                        <th colspan="2">12:00</th>
                        <th colspan="2">16:00</th>
                        <th colspan="2">20:00</th>
                        <th colspan="2">24:00</th>
                        <th colspan="2">04:00</th>
                        <th rowspan="2">Cleaning/Alarm check</th>
                    </tr>
                    <tr>
                        <th>Temp</th><th>Tech</th>
                        <th>Temp</th><th>Tech</th>
                        <th>Temp</th><th>Tech</th>
                        <th>Temp</th><th>Tech</th>
                        <th>Temp</th><th>Tech</th>
                        <th>Temp</th><th>Tech</th>
                    </tr>
                </thead>
                <tbody>`;

        for (let d = 1; d <= daysInMonth; d++) {
            const currentDate = new Date(year, month - 1, d);
            
            // التحقق إذا كان اليوم بعد تاريخ التفتيش
            if (currentDate > cutOffDate) {
                // نضع صفوفاً فارغة بدون بيانات (أو نتوقف تماماً حسب الرغبة)
                html += `<tr class="empty-row"><td>${d}</td>`;
                for (let k = 0; k < 13; k++) html += `<td></td>`;
                html += `</tr>`;
            } else {
                // تعبئة البيانات بشكل طبيعي
                html += `<tr><td>${d}</td>`;
                for (let j = 0; j < 6; j++) {
                    let temp = getRandomTemp(rangeMin + 0.1, rangeMax - 0.1);
                    let tech = techs[Math.floor(Math.random() * techs.length)];
                    html += `<td>${temp}</td><td>${tech}</td>`;
                }
                html += `<td>OK</td></tr>`;
            }
        }

        html += `
                </tbody>
            </table>
            <div class="signatures">
                <div>Supervisor Review</div>
                <div>QC Review</div>
            </div>
        </div>`;
        
        return html;
    }

    // الدالة الرئيسية لتوليد كل الفورمات
    function generateForms() {
        const section = document.getElementById('section').value;
        const fridgeNo = document.getElementById('fridgeNo').value;
        const rangeType = document.getElementById('rangeType').value;
        const startMonth = document.getElementById('startMonth').value; // YYYY-MM
        const endMonth = document.getElementById('endMonth').value;     // YYYY-MM
        const cutOffDate = document.getElementById('cutOffDate').value; // YYYY-MM-DD

        let rangeMin = 2, rangeMax = 8;
        if (rangeType === '-20') { rangeMin = -20.5; rangeMax = -19.5; }
        if (rangeType === '-80') { rangeMin = -80.5; rangeMax = -79.5; }

        const [startYear, startMon] = startMonth.split('-').map(Number);
        const [endYear, endMon] = endMonth.split('-').map(Number);

        let container = document.getElementById('formsContainer');
        container.innerHTML = '';

        let currentYear = startYear;
        let currentMon = startMon;

        // حلقة لتوليد فورم لكل شهر من البداية حتى النهاية
        while (currentYear < endYear || (currentYear === endYear && currentMon <= endMon)) {
            let formHtml = generateMonthForm(section, fridgeNo, rangeMin, rangeMax, currentYear, currentMon, cutOffDate);
            if (formHtml) {
                container.innerHTML += formHtml;
            }
            
            currentMon++;
            if (currentMon > 12) {
                currentMon = 1;
                currentYear++;
            }
        }
    }

    // تحديث النطاق عند تغيير النوع (اختياري)
    function updateRange() {
        // يمكن تركها فارغة لأن الدالة الرئيسية تقرأ القيمة مباشرة
    }

    // توليد تلقائي عند فتح الصفحة (لتجربة سريعة)
    window.onload = function() {
        generateForms();
    };
</script>

</body>
</html>
